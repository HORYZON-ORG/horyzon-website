name: Architect Funnel Protected Preview QA
on:
  push:
    branches: [feat/architect-funnel-preview-20261028]
  pull_request:
    paths:
      - 'src/app/(architect-funnel-preview)/**'
      - 'src/components/patrimonial-architect-preview*'
      - 'src/content/patrimonial-architect-preview-session.ts'
      - 'public/benessere-patrimoniale/percorso-architetto/**'
      - '.github/workflows/architect-funnel-preview-qa.yml'
permissions:
  contents: read
concurrency:
  group: architect-funnel-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PATRIMONIAL_ARCHITECT_PREVIEW_PAGE_ENABLED: 'true'
      PATRIMONIAL_ARCHITECT_PREVIEW_SUBMISSIONS_ENABLED: 'false'
      PATRIMONIAL_ARCHITECT_HUB_INTAKE_ENABLED: 'false'
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:architect-cv
      - run: node --no-warnings --experimental-strip-types scripts/verify-patrimonial-leads.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.0
      - run: npx playwright install chromium --with-deps
      - name: Preview page, lime accents, thank-you and assets without CRM access
        shell: bash
        run: |
          npx next start -p 3206 -H 127.0.0.1 > /tmp/horyzon-architect-preview.log 2>&1 &
          trap 'kill $! || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS 'http://127.0.0.1:3206/benessere-patrimoniale/percorso-architetto-patrimoniale' -o /tmp/architect-page.html; then break; fi
            sleep 2
          done
          grep -q 'Le persone si fidano di te' /tmp/architect-page.html
          grep -q 'noindex' /tmp/architect-page.html
          curl -fsS 'http://127.0.0.1:3206/benessere-patrimoniale/percorso-architetto-patrimoniale/grazie' -o /dev/null
          curl -fsS 'http://127.0.0.1:3206/benessere-patrimoniale/percorso-architetto/hero-telefono.jpg' -o /dev/null
          curl -sS -o /tmp/architect-bad-origin.txt -w '%{http_code}' -X POST 'http://127.0.0.1:3206/api/public-leads' -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' -d '{}' | grep -q '^403

          node scripts/verify-architect-preview-palette.mjs

      - name: Retain visual comparison screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: architect-preview-lime-visual-qa
          path: /tmp/architect-preview-*.png
          if-no-files-found: ignore
