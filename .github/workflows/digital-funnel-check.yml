name: Benessere Digitale — contract and CRM tests

on:
  push:
    branches:
      - feat/benessere-digitale-funnel
    paths:
      - 'src/lib/digital-leads/**'
      - 'scripts/verify-digital-funnel.mjs'
      - '.github/workflows/digital-funnel-check.yml'
  pull_request:
    paths:
      - 'src/lib/digital-leads/**'
      - 'scripts/verify-digital-funnel.mjs'
      - '.github/workflows/digital-funnel-check.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run digital funnel contracts (fully mocked — no secrets or remote side effects)
        run: node --no-warnings --experimental-strip-types scripts/verify-digital-funnel.mjs
