name: Horyzon Candidate Hub Integration
on:
  push:
    branches: [feat/architect-hub-intake-safe-20261028]
  pull_request:
    paths:
      - 'src/lib/public-leads/**'
      - 'scripts/verify-architect-cv.mjs'
      - 'package.json'
      - '.github/workflows/architect-hub-intake-safe.yml'
permissions:
  contents: read
concurrency:
  group: architect-hub-intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:architect-cv
      # Input regression runs without a build; the content verifier needs compiled HTML.
      - run: node --no-warnings --experimental-strip-types scripts/verify-patrimonial-leads.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          PATRIMONIAL_ARCHITECT_HUB_INTAKE_ENABLED: 'false'
          HORYZON_ARCHITETTI_AUTOPROVISION_ENABLED: 'false'
      - run: node scripts/verify-patrimonial-content.mjs
